name: Notificador de tickets

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:

concurrency:
  group: notificador
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # tiempo de espera para la ejecución del job
    steps:
      - uses: actions/checkout@v4 # checkout del repositorio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state
          key: tickets-state-${{ github.run_id }}
          restore-keys: tickets-state-

      - name: Revisar portal
        env:
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILTRO: ${{ secrets.FILTRO }}
          ESTADOS_EXCLUIDOS: ${{ secrets.ESTADOS_EXCLUIDOS }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: python monitor.py

      - name: Guardar estado
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: tickets-state-${{ github.run_id }}